# R3-AB-v3：A+B 组合（扩充后清洗数据）
# 数据：1771 条完整样本（v2 1131 + 额外 640 含 rule2/rule7 边界样本）
# 基础：Qwen3-14B  目标：F1 ≥ 0.50，rule2/rule7 ≥ 0.60

model_name_or_path: /home/yinrong/models/Qwen3-14B
template: qwen3
trust_remote_code: true

finetuning_type: lora
lora_rank: 128
lora_alpha: 256
lora_dropout: 0.0
lora_target: all

dataset: spc_r3_AB_v3
dataset_dir: /home/yinrong/post-train/impl2.1/round3/data
cutoff_len: 5120

num_train_epochs: 3
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 1.0e-04
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01

bf16: true
flash_attn: sdpa

logging_steps: 5
save_strategy: epoch
save_total_limit: 1

output_dir: /home/yinrong/post-train/impl2.1/round3/checkpoints/R3-AB-v3

do_train: true
report_to: none
