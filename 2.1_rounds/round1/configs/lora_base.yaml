### LoRA 基础超参配置
### 4个训练节点共用，dataset 和 output_dir 由 CLI 覆盖

## 模型
model_name_or_path: /home/yinrong/models/Qwen3-14B
template: qwen3
trust_remote_code: true

## 微调方式
finetuning_type: lora
lora_rank: 128
lora_alpha: 256
lora_dropout: 0.0
lora_target: all   # attention (q/k/v/o) + FFN (gate/up/down)

## 数据
# dataset: 由 CLI 覆盖，如 --dataset spc_N1
cutoff_len: 4096
max_samples: null

## 训练超参
num_train_epochs: 3
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01

## 精度与加速
bf16: true
flash_attn: sdpa
ddp_find_unused_parameters: false

## 日志与保存
logging_steps: 5
save_strategy: epoch
save_total_limit: 2
# output_dir: 由 CLI 覆盖，如 --output_dir /data/checkpoints/demo-N1

## 其他
do_train: true
report_to: none
