# R3-E1：8卡 ZeRO-3 LoRA — Qwen3-72B（方向E）
# 目标：验证 72B 在 8×H20 上可训练，F1 ≥ 0.45
# 训练显存预期：~42GB/卡（8卡共 768GB，ZeRO-3 分片后每卡约 100GB 峰值）
#
# 运行命令（需在 8 卡节点执行）：
#   torchrun --nproc_per_node=8 \
#     $(python -c "import llamafactory; print(llamafactory.__file__.replace('__init__.py','train/tuner.py'))") \
#     configs/R3-E1-zero3-72b.yaml \
#     --deepspeed configs/deepspeed_zero3.json
#
# 或用 LLaMA-Factory CLI：
#   FORCE_TORCHRUN=1 llamafactory-cli train configs/R3-E1-zero3-72b.yaml \
#     --deepspeed configs/deepspeed_zero3.json

model_name_or_path: /home/yinrong/models/Qwen3-72B
template: qwen3
trust_remote_code: true

finetuning_type: lora
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.0
lora_target: all

dataset: spc_r3_AB
cutoff_len: 5120

num_train_epochs: 3
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 5.0e-05          # 更大模型用更小 lr
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01

bf16: true
flash_attn: fa2                  # 72B 需要 flash_attn v2 降显存

logging_steps: 5
save_strategy: epoch
save_total_limit: 1
ddp_find_unused_parameters: false

output_dir: /home/yinrong/post-train/impl2.1/round3/checkpoints/R3-E1-zero3-72b

do_train: true
report_to: none
